<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>タイトル | 景彦備忘録</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Zen+Old+Mincho:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0f1e3f;
      --gold: #cdaa80;
      --old-gold: #997953;
      --text: #f3eee8;
      --line: rgba(205,170,128,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 30%),
        linear-gradient(to bottom, #081225, #0f1e3f);

      color: var(--text);
      font-family: 'Zen Old Mincho', serif;
      min-height: 100vh;
      letter-spacing: 0.04em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.16) 1px, transparent 1px);

      background-size: 140px 140px;
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }

    header {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--line);
    }

    .top-links {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .top-links a {
      color: rgba(243,238,232,0.6);
      text-decoration: none;
      transition: 0.3s ease;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
    }

    .top-links a:hover {
      color: var(--gold);
    }

    h1 {
      color: var(--gold);
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .series-info {
      margin-top: 1rem;
      color: var(--old-gold);
      letter-spacing: 0.2em;
      font-size: 0.85rem;
    }

    .summary {
      margin-top: 3rem;
      max-width: 700px;
      line-height: 2.2;
      color: rgba(243,238,232,0.8);
    }

    main {
      width: min(1000px, 92%);
      margin: 5rem auto 8rem;
    }

    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .chapter-link {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      text-decoration: none;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(205,170,128,0.12);
      transition: 0.35s ease;
    }

    .chapter-link:hover {
      padding-left: 0.8rem;
    }

    .chapter-number {
      color: var(--old-gold);
      font-size: 0.8rem;
      letter-spacing: 0.2em;
    }

    .chapter-title {
      color: var(--gold);
      font-size: 1.5rem;
      letter-spacing: 0.08em;
    }

    .chapter-date {
      color: rgba(243,238,232,0.45);
      font-size: 0.85rem;
    }

    footer {
      width: min(1000px, 92%);
      margin: 0 auto 3rem;
      border-top: 1px solid var(--line);
      padding-top: 2rem;
      color: rgba(243,238,232,0.35);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body>

  <header>

    <div class="top-links">
      <a href="../../index.html">← TOP</a>
      <a href="../rennsai.html">← SERIES</a>
    </div>

    <h1>タイトル</h1>

    <div class="series-info">
      SERIALIZE
    </div>

    <div class="summary">
      ここにあらすじとか説明を書く。
    </div>

  </header>

  <main>

    <div class="chapter-list">

      <a href="01.html" class="chapter-link">

        <div class="chapter-number">
          CHAPTER 01
        </div>

        <div class="chapter-title">
          タイトル
        </div>

        <div class="chapter-date">
          2026.05.21
        </div>

      </a>

      <a href="02.html" class="chapter-link">

        <div class="chapter-number">
          CHAPTER 02
        </div>

        <div class="chapter-title">
          タイトル
        </div>

        <div class="chapter-date">
          2026.05.21
        </div>

      </a>

    </div>

  </main>

  <footer>
    KEIHIKO ARCHIVE
  </footer>

</body>
</html>
