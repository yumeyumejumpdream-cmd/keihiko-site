  <style>
    :root {
      --bg: #0f1e3f;
      --gold: #cdaa80;
      --old-gold: #997953;
      --text: #f3eee8;
      --line: rgba(205,170,128,0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

.message-link {
  margin-top: 6rem;
  text-align: center;
}

.message-link a {
  color: #cdaa80;
  text-decoration: none;
  letter-spacing: 0.15em;
  border-bottom: 1px solid rgba(205,170,128,0.25);
  padding-bottom: 0.4rem;
  transition: 0.3s ease;
}

.message-link a:hover {
  opacity: 0.7;
}

    body {
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 30%),
        linear-gradient(to bottom, #081225, #0f1e3f);
      color: var(--text);
      font-family: 'Zen Old Mincho', serif;
      min-height: 100vh;
      letter-spacing: 0.04em;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px);
      background-size: 140px 140px;
      opacity: 0.12;
      pointer-events: none;
      z-index: -1;
    }

    header {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 3rem 0 2rem;
      border-bottom: 1px solid var(--line);
    }

    .back {
      display: inline-block;
      margin-bottom: 2rem;
      color: rgba(243,238,232,0.6);
      text-decoration: none;
      transition: 0.3s ease;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
    }

    .back:hover {
      color: var(--gold);
    }

    h1 {
      color: var(--gold);
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 500;
      letter-spacing: 0.12em;
    }

    .sub {
      margin-top: 1rem;
      color: var(--old-gold);
      letter-spacing: 0.25em;
      font-size: 0.8rem;
    }

    main {
      width: min(1000px, 92%);
      margin: 5rem auto 8rem;
    }

    .novel-list {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .novel-link {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      text-decoration: none;
      padding-bottom: 2rem;
      border-bottom: 1px solid rgba(205,170,128,0.12);
      transition: 0.35s ease;
    }

    .novel-link:hover {
      padding-left: 0.8rem;
    }

    .novel-title {
      color: var(--gold);
      font-size: 1.5rem;
      letter-spacing: 0.08em;
    }

    .novel-info {
      color: rgba(243,238,232,0.55);
      font-size: 0.9rem;
      line-height: 1.9;
    }

    footer {
      width: min(1000px, 92%);
      margin: 0 auto 3rem;
      border-top: 1px solid var(--line);
      padding-top: 2rem;
      color: rgba(243,238,232,0.35);
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    @media (max-width: 768px) {
      .novel-title {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
